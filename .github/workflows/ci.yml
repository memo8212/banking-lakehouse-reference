name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Generate sample data
        run: python data/generate_sample_data.py

      - name: Run the medallion
        run: python -m lakehouse run

      - name: Tests
        run: pytest -q tests/

      - name: Governance as code (render)
        run: |
          python -m governance access
          python -m governance share

      - name: Show reconciliation report
        run: cat lakehouse_storage/recon/reconciliation_report.md
