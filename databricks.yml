# Databricks Asset Bundle — banking lakehouse reference.
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev
#   databricks bundle run bank_daily_load -t dev
bundle:
  name: banking-lakehouse-reference

variables:
  catalog:
    default: bank_dev
  schema:
    default: gold

workspace:
  host: ${DATABRICKS_HOST}
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

include:
  - resources/*.yml

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: ${DATABRICKS_HOST}
  prod:
    mode: production
    workspace:
      host: ${DATABRICKS_HOST_PROD}
    run_as:
      service_principal_name: ${DATABRICKS_SP_NAME}
