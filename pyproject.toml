[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-lakehouse-reference"
version = "0.1.0"
description = "Production-shaped bank lakehouse on Databricks (medallion + contracts + governance)"
requires-python = ">=3.9"
dependencies = ["pyspark>=3.5", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "delta-spark>=3.0"]

[project.scripts]
banklake = "lakehouse.cli:main"

[tool.setuptools]
packages = ["lakehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".venv", ".git", "lakehouse_storage", "artifacts", "notebooks", "pipelines"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501", "F841", "E702", "E741", "F541"]
